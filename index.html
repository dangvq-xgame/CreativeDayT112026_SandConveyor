<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sand Conveyor — Unity Mobile Web Demo</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>

<body>
  <div class="app">
    <div class="stage" id="stage">
      <!-- Unity Mobile Top HUD (matching _Docs/image.png & SandLoopGame UITopBar) -->
      <header class="hud">
        <div class="hud-left">
          <button class="unity-gear-btn" id="btn-levels" title="Menu & Chọn Level (1-5)">
            <img src="./assets/images/ui/btn_setting_gear.png" alt="Settings" class="gear-icon-img" />
          </button>
          <button class="unity-mini-btn" id="btn-restart" title="Chơi lại màn này">
            <img src="./assets/images/ui/btn_replay.png" alt="Replay" class="mini-icon-img" />
          </button>
          <button class="unity-mini-btn" id="btn-sound" title="Bật/Tắt Âm thanh">
            <img src="./assets/images/ui/icon_sound.png" alt="Sound" class="mini-icon-img" />
          </button>
          <button class="unity-speed-btn" id="btn-speed" title="Tốc độ game: 1x -> 2x -> 5x">
            <span class="speed-bolt">⚡</span><strong id="speed-label">1x</strong>
          </button>
        </div>

        <div class="hud-center">
          <button class="unity-level-badge" id="btn-level-pill" title="Nhấn để chọn Level 1-5">
            <span class="unity-level-text" id="hud-level-title">Level 1</span>
            <small class="unity-level-sub" id="hud-level-sub">Nắng Vàng Rực Rỡ</small>
          </button>
          <div class="prog-bar" title="Tiến độ hút cát">
            <i id="hud-progress-fill"></i>
          </div>
        </div>

        <div class="hud-right">
          <div class="unity-coin-bar" title="Coins (Nhấn + để nhận thêm 500 xu test)">
            <img src="./assets/images/ui/icon_gold.png" alt="Coin" class="coin-star-img" />
            <strong class="coin-amount-text" id="hud-coins-text">500</strong>
            <button class="coin-plus-btn" id="btn-add-coins" type="button" title="+500 Coins">
              <img src="./assets/images/ui/btn_plus_green.png" alt="+" />
            </button>
          </div>
        </div>
      </header>

      <!-- Hand Booster Active Banner -->
      <div class="hand-banner" id="hand-booster-banner" hidden>
        <span>👆 Chạm vào <strong>1 xô đang khóa</strong> trên băng chuyền để mở nắp ngay!</span>
        <button class="cancel-hand-btn" id="btn-cancel-hand">✕ Hủy</button>
      </div>

      <!-- Main Game Canvas -->
      <canvas id="game-canvas"></canvas>

      <!-- Tutorial Hint -->
      <div class="gameplay-hint" id="gameplay-hint">
        Chạm vào ống kính để bắn vít (Đủ 3 vít cùng màu sẽ mở nắp xô cát!)
      </div>

      <!-- Unity Mobile Bottom 3-Booster Dock (matching _Docs/image.png & UIBoosterBtn) -->
      <footer class="unity-booster-dock">
        <!-- Booster 1: ExtraSlot -->
        <button class="unity-booster-circle" id="booster-extra-slot"
          title="Booster 1: Mở thêm Slot băng chuyền (2 -> 3 -> 4)">
          <div class="booster-ring">
            <img src="./assets/images/ui/icon_add_slot.png" alt="Extra Slot" class="booster-sprite" />
          </div>
          <span class="unity-red-badge" id="badge-extra-slot">3</span>
          <span class="booster-caption" id="label-slot-status">Slot 2/4</span>
        </button>

        <!-- Booster 2: Hand -->
        <button class="unity-booster-circle" id="booster-hand"
          title="Booster 2: Bàn Tay mở khóa ngay 1 xô trên băng chuyền">
          <div class="booster-ring">
            <img src="./assets/images/ui/icon_hand.png" alt="Hand Booster" class="booster-sprite" />
          </div>
          <span class="unity-red-badge" id="badge-hand">3</span>
          <span class="booster-caption">Bàn Tay</span>
        </button>

        <!-- Booster 3: Shuffle -->
        <button class="unity-booster-circle" id="booster-shuffle"
          title="Booster 3: Đảo vít trong ống & ưu tiên màu xô đang khóa">
          <div class="booster-ring">
            <img src="./assets/images/ui/icon_shuffle.png" alt="Shuffle Booster" class="booster-sprite" />
          </div>
          <span class="unity-red-badge" id="badge-shuffle">3</span>
          <span class="booster-caption">Đảo Vít</span>
        </button>
      </footer>

      <!-- Level Select & Settings Modal (Levels 1..5) -->
      <div class="overlay" id="level-menu-modal" hidden>
        <div class="modal-card menu-card">
          <div class="modal-header">
            <div>
              <span class="eyebrow">CHỌN MÀN CHƠI DEMO</span>
              <h2>Danh sách Level (1–5)</h2>
            </div>
            <button class="close-btn" id="btn-close-menu">✕</button>
          </div>
          <div class="level-list" id="level-menu-list"></div>
          <div class="modal-footer">
            <button class="secondary-btn" id="btn-reset-save">Khôi phục Save gốc</button>
          </div>
        </div>
      </div>

      <!-- Win / Lose / Revive Result Overlay -->
      <div class="overlay" id="result-overlay" hidden>
        <div class="modal-card result-card">
          <span class="eyebrow" id="result-eyebrow">HOÀN THÀNH</span>
          <h2 id="result-title">Tuyệt vời!</h2>
          <p id="result-desc">Toàn bộ tranh cát đã được hút sạch.</p>
          <div class="result-actions">
            <button class="cta-btn alt-green" id="btn-result-revive" hidden>
              +1 Lỗ chờ & Chơi tiếp
            </button>
            <button class="cta-btn" id="btn-result-primary">Màn tiếp theo</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
